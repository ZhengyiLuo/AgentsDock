name: Accept prepared AgentsDock product

# Never runs on pull_request and never receives production signing credentials.
# This installs software and changes trust/routing ONLY on disposable hosted VMs.
on:
  workflow_dispatch:
    inputs:
      prepare_run_id:
        description: Successful Release AgentsDock preparation run
        type: string
        required: true
      accepted_receipt_sha256:
        description: Independently reviewed release.json SHA-256
        type: string
        required: true
      baseline_app:
        description: Published stable app for the real updater journey
        type: string
        default: '1.0.6'
        required: true
      baseline_server:
        description: Published signed legacy server for migration
        type: string
        default: '1.0.3'
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: product-acceptance-${{ inputs.prepare_run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  native-server:
    if: github.repository == 'ZhengyiLuo/AgentsDock' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
          - runner: macos-15
            platform: darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Prepare native prerequisites, not application state
        run: |
          uv python install 3.13
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y tmux
            sudo loginctl enable-linger "$(id -un)"
            systemctl --user show-environment > /dev/null
          else
            command -v tmux || brew install tmux
          fi
      - uses: ./.github/actions/product-acceptance-inputs
        with:
          prepare_run_id: ${{ inputs.prepare_run_id }}
          receipt_sha256: ${{ inputs.accepted_receipt_sha256 }}
          baseline_app: ${{ inputs.baseline_app }}
          baseline_server: ${{ inputs.baseline_server }}
          github_token: ${{ github.token }}
      - name: Install exact npm package through its real CLI and native service manager
        env:
          RECEIPT_SHA256: ${{ inputs.accepted_receipt_sha256 }}
          TEST_PLATFORM: ${{ matrix.platform }}
        run: |
          umask 022
          python3 scripts/product_server_acceptance.py bootstrap --kind fresh \
            --receipt "$RUNNER_TEMP/product-inputs/product/release.json" --receipt-sha256 "$RECEIPT_SHA256" \
            --prepare-run "$RUNNER_TEMP/product-inputs/prepare-run.json" --bundle "$RUNNER_TEMP/product-inputs/product/server" \
            --work "$RUNNER_TEMP/agentsdock-acceptance-fresh" \
            --fixture "$RUNNER_TEMP/agentsdock-acceptance-fresh/server.json" \
            --evidence "$RUNNER_TEMP/agentsdock-acceptance-fresh/bootstrap.json"
          mkdir "$RUNNER_TEMP/public-evidence"
          cp "$RUNNER_TEMP/agentsdock-acceptance-fresh/bootstrap.json" "$RUNNER_TEMP/public-evidence/server-$TEST_PLATFORM.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-acceptance-${{ github.run_attempt }}-server-${{ matrix.platform }}
          path: ${{ runner.temp }}/public-evidence/server-${{ matrix.platform }}.json
          if-no-files-found: warn
          retention-days: 14

  native-desktop:
    if: github.repository == 'ZhengyiLuo/AgentsDock' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    strategy:
      fail-fast: false
      matrix:
        legacy_mode: ['0755', '0750']
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Prepare native prerequisites before origin routing
        run: |
          uv python install 3.13
          command -v tmux || brew install tmux
          /bin/launchctl print "gui/$(id -u)" > /dev/null
      - uses: ./.github/actions/product-acceptance-inputs
        with:
          prepare_run_id: ${{ inputs.prepare_run_id }}
          receipt_sha256: ${{ inputs.accepted_receipt_sha256 }}
          baseline_app: ${{ inputs.baseline_app }}
          baseline_server: ${{ inputs.baseline_server }}
          github_token: ${{ github.token }}
      - name: Install populated signed legacy fixture without touching any existing installation
        env:
          RECEIPT_SHA256: ${{ inputs.accepted_receipt_sha256 }}
          BASELINE_SERVER: ${{ inputs.baseline_server }}
          LEGACY_MODE: ${{ matrix.legacy_mode }}
        run: |
          umask 022
          python3 scripts/product_server_acceptance.py bootstrap --kind legacy \
            --receipt "$RUNNER_TEMP/product-inputs/product/release.json" --receipt-sha256 "$RECEIPT_SHA256" \
            --prepare-run "$RUNNER_TEMP/product-inputs/prepare-run.json" --bundle "$RUNNER_TEMP/product-inputs/product/server" \
            --work "$RUNNER_TEMP/agentsdock-acceptance-legacy" \
            --fixture "$RUNNER_TEMP/agentsdock-acceptance-legacy/server.json" \
            --evidence "$RUNNER_TEMP/agentsdock-acceptance-legacy/bootstrap.json" \
            --baseline-archive "$RUNNER_TEMP/product-inputs/baseline-server/agents-server-$BASELINE_SERVER.tar.gz" \
            --baseline-manifest "$RUNNER_TEMP/product-inputs/baseline-server/agents-server-manifest.json" \
            --baseline-signature "$RUNNER_TEMP/product-inputs/baseline-server/agents-server-manifest.sig" \
            --legacy-root-mode "$LEGACY_MODE"
      - name: Configure ephemeral exact-origin replay on the disposable VM only
        env:
          RECEIPT_SHA256: ${{ inputs.accepted_receipt_sha256 }}
          BASELINE_APP: ${{ inputs.baseline_app }}
        run: |
          python3 scripts/product_acceptance_network.py setup \
            --receipt "$RUNNER_TEMP/product-inputs/product/release.json" --receipt-sha256 "$RECEIPT_SHA256" \
            --work "$RUNNER_TEMP/agentsdock-acceptance-network"
          set -a
          source "$RUNNER_TEMP/agentsdock-acceptance-network/trust.env"
          set +a
          /bin/launchctl setenv SSL_CERT_FILE "$SSL_CERT_FILE"
          /bin/launchctl setenv NODE_EXTRA_CA_CERTS "$NODE_EXTRA_CA_CERTS"
          if tmux show-environment -g > /dev/null 2>&1; then
            tmux set-environment -g SSL_CERT_FILE "$SSL_CERT_FILE"
            tmux set-environment -g NODE_EXTRA_CA_CERTS "$NODE_EXTRA_CA_CERTS"
          fi
          python3 scripts/product_server_acceptance.py service --action restart \
            --receipt "$RUNNER_TEMP/product-inputs/product/release.json" --receipt-sha256 "$RECEIPT_SHA256" \
            --prepare-run "$RUNNER_TEMP/product-inputs/prepare-run.json" --bundle "$RUNNER_TEMP/product-inputs/product/server" \
            --work "$RUNNER_TEMP/agentsdock-acceptance-legacy" --fixture "$RUNNER_TEMP/agentsdock-acceptance-legacy/server.json" \
            --evidence "$RUNNER_TEMP/agentsdock-acceptance-legacy/restarted.json"
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted RUNNER_OS="$RUNNER_OS" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
            GITHUB_SHA="$GITHUB_SHA" RUNNER_TEMP="$RUNNER_TEMP" \
            "$(command -v node)" scripts/product-release-replay.mjs serve \
            --receipt "$RUNNER_TEMP/product-inputs/product/release.json" --receipt-sha256 "$RECEIPT_SHA256" \
            --prepare-run "$RUNNER_TEMP/product-inputs/prepare-run.json" \
            --server-assets "$RUNNER_TEMP/product-inputs/product/server" --desktop-assets "$RUNNER_TEMP/product-inputs/desktop" \
            --baseline-desktop "$RUNNER_TEMP/product-inputs/baseline-desktop" --baseline-version "$BASELINE_APP" \
            --certificate "$RUNNER_TEMP/agentsdock-acceptance-network/leaf.pem" \
            --private-key "$RUNNER_TEMP/agentsdock-acceptance-network/leaf.key" \
            --pid-file "$RUNNER_TEMP/agentsdock-acceptance-network/replay.pid" \
            > "$RUNNER_TEMP/agentsdock-acceptance-network/replay.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent --max-time 2 https://github.com/ZhengyiLuo/AgentsDock/releases.atom > /dev/null; then exit 0; fi
            sleep 1
          done
          echo 'Ephemeral replay did not become ready.' >&2
          exit 1
      - name: Click update, observe native replacement, and reconcile saved server profiles
        env:
          RECEIPT_SHA256: ${{ inputs.accepted_receipt_sha256 }}
          BASELINE_APP: ${{ inputs.baseline_app }}
          LEGACY_MODE: ${{ matrix.legacy_mode }}
        run: |
          set -a
          source "$RUNNER_TEMP/agentsdock-acceptance-network/trust.env"
          set +a
          node scripts/product_desktop_acceptance.mjs \
            --receipt "$RUNNER_TEMP/product-inputs/product/release.json" --receipt-sha256 "$RECEIPT_SHA256" \
            --preparation-run "$RUNNER_TEMP/product-inputs/prepare-run.json" \
            --server-directory "$RUNNER_TEMP/product-inputs/product/server" --desktop-directory "$RUNNER_TEMP/product-inputs/desktop" \
            --baseline-directory "$RUNNER_TEMP/product-inputs/baseline-desktop" --baseline-version "$BASELINE_APP" \
            --server-fixture "$RUNNER_TEMP/agentsdock-acceptance-legacy/server.json" \
            --output "$RUNNER_TEMP/agentsdock-acceptance-legacy/desktop"
          mkdir "$RUNNER_TEMP/public-evidence"
          cp "$RUNNER_TEMP/agentsdock-acceptance-legacy/desktop/desktop-evidence.json" "$RUNNER_TEMP/public-evidence/desktop-$LEGACY_MODE.json"
      - name: Restore native trust and routing before artifact upload
        if: always()
        run: |
          /bin/launchctl unsetenv SSL_CERT_FILE
          /bin/launchctl unsetenv NODE_EXTRA_CA_CERTS
          if tmux show-environment -g > /dev/null 2>&1; then
            tmux set-environment -gu SSL_CERT_FILE
            tmux set-environment -gu NODE_EXTRA_CA_CERTS
          fi
          if [[ -f "$RUNNER_TEMP/agentsdock-acceptance-network/replay.pid" ]]; then
            REPLAY_PID="$(cat "$RUNNER_TEMP/agentsdock-acceptance-network/replay.pid")"
            [[ "$REPLAY_PID" =~ ^[1-9][0-9]*$ ]]
            if ps -p "$REPLAY_PID" -o command= | grep -F 'scripts/product-release-replay.mjs serve' | grep -F "$RUNNER_TEMP/agentsdock-acceptance-network/leaf.key" > /dev/null; then
              kill -TERM "$REPLAY_PID"
            fi
          fi
          if [[ -f "$RUNNER_TEMP/agentsdock-acceptance-network/owner.json" ]]; then
            python3 scripts/product_acceptance_network.py teardown --work "$RUNNER_TEMP/agentsdock-acceptance-network"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-acceptance-${{ github.run_attempt }}-desktop-${{ matrix.legacy_mode }}
          path: ${{ runner.temp }}/public-evidence/desktop-${{ matrix.legacy_mode }}.json
          if-no-files-found: warn
          retention-days: 14

  native-recovery:
    if: github.repository == 'ZhengyiLuo/AgentsDock' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - operation: failure-retry
            evidence: recovery-linux
          - operation: rollback-retry
            evidence: rollback-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Prepare native prerequisites
        run: |
          uv python install 3.13
          sudo apt-get update
          sudo apt-get install -y tmux
          sudo loginctl enable-linger "$(id -un)"
          systemctl --user show-environment > /dev/null
      - uses: ./.github/actions/product-acceptance-inputs
        with:
          prepare_run_id: ${{ inputs.prepare_run_id }}
          receipt_sha256: ${{ inputs.accepted_receipt_sha256 }}
          baseline_app: ${{ inputs.baseline_app }}
          baseline_server: ${{ inputs.baseline_server }}
          github_token: ${{ github.token }}
      - name: Install the actual signed legacy baseline
        env:
          RECEIPT_SHA256: ${{ inputs.accepted_receipt_sha256 }}
          BASELINE_SERVER: ${{ inputs.baseline_server }}
        run: |
          umask 022
          python3 scripts/product_server_acceptance.py bootstrap --kind legacy \
            --receipt "$RUNNER_TEMP/product-inputs/product/release.json" --receipt-sha256 "$RECEIPT_SHA256" \
            --prepare-run "$RUNNER_TEMP/product-inputs/prepare-run.json" --bundle "$RUNNER_TEMP/product-inputs/product/server" \
            --work "$RUNNER_TEMP/agentsdock-acceptance-recovery" \
            --fixture "$RUNNER_TEMP/agentsdock-acceptance-recovery/server.json" \
            --evidence "$RUNNER_TEMP/agentsdock-acceptance-recovery/bootstrap.json" \
            --baseline-archive "$RUNNER_TEMP/product-inputs/baseline-server/agents-server-$BASELINE_SERVER.tar.gz" \
            --baseline-manifest "$RUNNER_TEMP/product-inputs/baseline-server/agents-server-manifest.json" \
            --baseline-signature "$RUNNER_TEMP/product-inputs/baseline-server/agents-server-manifest.sig"
      - name: Route exact packages with a one-shot interrupted-download control
        env:
          RECEIPT_SHA256: ${{ inputs.accepted_receipt_sha256 }}
          BASELINE_APP: ${{ inputs.baseline_app }}
        run: |
          python3 scripts/product_acceptance_network.py setup \
            --receipt "$RUNNER_TEMP/product-inputs/product/release.json" --receipt-sha256 "$RECEIPT_SHA256" \
            --work "$RUNNER_TEMP/agentsdock-acceptance-network"
          set -a
          source "$RUNNER_TEMP/agentsdock-acceptance-network/trust.env"
          set +a
          systemctl --user set-environment SSL_CERT_FILE="$SSL_CERT_FILE" NODE_EXTRA_CA_CERTS="$NODE_EXTRA_CA_CERTS"
          if tmux show-environment -g > /dev/null 2>&1; then
            tmux set-environment -g SSL_CERT_FILE "$SSL_CERT_FILE"
            tmux set-environment -g NODE_EXTRA_CA_CERTS "$NODE_EXTRA_CA_CERTS"
          fi
          python3 scripts/product_server_acceptance.py service --action restart \
            --receipt "$RUNNER_TEMP/product-inputs/product/release.json" --receipt-sha256 "$RECEIPT_SHA256" \
            --prepare-run "$RUNNER_TEMP/product-inputs/prepare-run.json" --bundle "$RUNNER_TEMP/product-inputs/product/server" \
            --work "$RUNNER_TEMP/agentsdock-acceptance-recovery" --fixture "$RUNNER_TEMP/agentsdock-acceptance-recovery/server.json" \
            --evidence "$RUNNER_TEMP/agentsdock-acceptance-recovery/restarted.json"
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted RUNNER_OS="$RUNNER_OS" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
            GITHUB_SHA="$GITHUB_SHA" RUNNER_TEMP="$RUNNER_TEMP" \
            "$(command -v node)" scripts/product-release-replay.mjs serve \
            --receipt "$RUNNER_TEMP/product-inputs/product/release.json" --receipt-sha256 "$RECEIPT_SHA256" \
            --prepare-run "$RUNNER_TEMP/product-inputs/prepare-run.json" \
            --server-assets "$RUNNER_TEMP/product-inputs/product/server" --desktop-assets "$RUNNER_TEMP/product-inputs/desktop" \
            --baseline-desktop "$RUNNER_TEMP/product-inputs/baseline-desktop" --baseline-version "$BASELINE_APP" \
            --certificate "$RUNNER_TEMP/agentsdock-acceptance-network/leaf.pem" \
            --private-key "$RUNNER_TEMP/agentsdock-acceptance-network/leaf.key" \
            --pid-file "$RUNNER_TEMP/agentsdock-acceptance-network/replay.pid" \
            --fault-control "$RUNNER_TEMP/agentsdock-acceptance-recovery/fault.json" \
            --fault-observed "$RUNNER_TEMP/agentsdock-acceptance-recovery/fault-observed.json" \
            > "$RUNNER_TEMP/agentsdock-acceptance-network/replay.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent --max-time 2 https://github.com/ZhengyiLuo/AgentsDock/releases.atom > /dev/null; then exit 0; fi
            sleep 1
          done
          echo 'Ephemeral replay did not become ready.' >&2
          exit 1
      - name: Exercise owned native failure, preserve incumbent data, then retry exact bytes
        env:
          RECEIPT_SHA256: ${{ inputs.accepted_receipt_sha256 }}
          RECOVERY_OPERATION: ${{ matrix.operation }}
          EVIDENCE_NAME: ${{ matrix.evidence }}
        run: |
          set -a
          source "$RUNNER_TEMP/agentsdock-acceptance-network/trust.env"
          set +a
          python3 scripts/product_server_acceptance.py "$RECOVERY_OPERATION" \
            --receipt "$RUNNER_TEMP/product-inputs/product/release.json" --receipt-sha256 "$RECEIPT_SHA256" \
            --prepare-run "$RUNNER_TEMP/product-inputs/prepare-run.json" --bundle "$RUNNER_TEMP/product-inputs/product/server" \
            --work "$RUNNER_TEMP/agentsdock-acceptance-recovery" \
            --fixture "$RUNNER_TEMP/agentsdock-acceptance-recovery/server.json" \
            --evidence "$RUNNER_TEMP/agentsdock-acceptance-recovery/recovery.json" \
            --fault-control "$RUNNER_TEMP/agentsdock-acceptance-recovery/fault.json" \
            --fault-observed "$RUNNER_TEMP/agentsdock-acceptance-recovery/fault-observed.json"
          mkdir "$RUNNER_TEMP/public-evidence"
          cp "$RUNNER_TEMP/agentsdock-acceptance-recovery/recovery.json" "$RUNNER_TEMP/public-evidence/$EVIDENCE_NAME.json"
      - name: Restore native trust and routing before artifact upload
        if: always()
        run: |
          systemctl --user unset-environment SSL_CERT_FILE NODE_EXTRA_CA_CERTS
          if tmux show-environment -g > /dev/null 2>&1; then
            tmux set-environment -gu SSL_CERT_FILE
            tmux set-environment -gu NODE_EXTRA_CA_CERTS
          fi
          if [[ -f "$RUNNER_TEMP/agentsdock-acceptance-network/replay.pid" ]]; then
            REPLAY_PID="$(cat "$RUNNER_TEMP/agentsdock-acceptance-network/replay.pid")"
            [[ "$REPLAY_PID" =~ ^[1-9][0-9]*$ ]]
            if ps -p "$REPLAY_PID" -o command= | grep -F 'scripts/product-release-replay.mjs serve' | grep -F "$RUNNER_TEMP/agentsdock-acceptance-network/leaf.key" > /dev/null; then
              kill -TERM "$REPLAY_PID"
            fi
          fi
          if [[ -f "$RUNNER_TEMP/agentsdock-acceptance-network/owner.json" ]]; then
            python3 scripts/product_acceptance_network.py teardown --work "$RUNNER_TEMP/agentsdock-acceptance-network"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-acceptance-${{ github.run_attempt }}-${{ matrix.evidence }}
          path: ${{ runner.temp }}/public-evidence/${{ matrix.evidence }}.json
          if-no-files-found: warn
          retention-days: 14

  acceptance:
    needs: [native-server, native-desktop, native-recovery]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: product-release-${{ inputs.prepare_run_id }}
          run-id: ${{ inputs.prepare_run_id }}
          github-token: ${{ github.token }}
          path: product
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: native-acceptance-${{ github.run_attempt }}-*
          merge-multiple: true
          path: observations
      - id: report
        name: Require every native scenario; missing, blocked, stale or failed evidence cannot pass
        env:
          RECEIPT_SHA256: ${{ inputs.accepted_receipt_sha256 }}
        run: |
          mkdir accepted
          node scripts/product-acceptance.mjs product/release.json "$RECEIPT_SHA256" observations accepted/acceptance.json
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs'
          const report = JSON.parse(readFileSync('accepted/acceptance.json'))
          console.log(`version=${report.version}`)
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AgentsDock-${{ steps.report.outputs.version }}-acceptance
          path: accepted/acceptance.json
          if-no-files-found: error
          retention-days: 14
