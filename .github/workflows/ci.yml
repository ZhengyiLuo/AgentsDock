name: Verify source

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      npm_native_validation:
        description: Validate only the signed npm draft on disposable macOS and Linux hosts; not product acceptance
        type: boolean
        default: false
      npm_candidate_tag:
        description: Exact unpublished npm-candidate-vVERSION tag for npm-only validation
        type: string
        default: ''
      npm_manifest_sha256:
        description: Independently reviewed npm descriptor SHA-256 for npm-only validation
        type: string
        default: ''
      npm_source_sha:
        description: Exact signed npm candidate source SHA; required for npm-only validation and distinct from the harness commit
        type: string
        default: ''
      candidate_replay:
        description: Rehearse pinned macOS beta and signed legacy server on disposable hosts; not production acceptance
        type: boolean
        default: false
      candidate_tag:
        description: Exact unpublished candidate-replay-vX.Y.Z-beta.N tag
        type: string
        default: ''
      candidate_receipt_sha256:
        description: Independently reviewed candidate.json SHA-256
        type: string
        default: ''
      candidate_bundle_sha256:
        description: Independently reviewed candidate-bundle.zip SHA-256
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: verify-source-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.npm_native_validation && '-npm-native' || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.candidate_replay && '-candidate' || '' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.npm_native_validation || inputs.candidate_replay)) }}

jobs:

  release-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Validate mutually exclusive native inputs before any installation
        if: github.event_name == 'workflow_dispatch'
        env:
          NPM_NATIVE_VALIDATION: ${{ inputs.npm_native_validation }}
          CANDIDATE_REPLAY: ${{ inputs.candidate_replay }}
          NPM_CANDIDATE_TAG: ${{ inputs.npm_candidate_tag }}
          NPM_MANIFEST_SHA256: ${{ inputs.npm_manifest_sha256 }}
          NPM_SOURCE_SHA: ${{ inputs.npm_source_sha }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_RECEIPT_SHA256: ${{ inputs.candidate_receipt_sha256 }}
          CANDIDATE_BUNDLE_SHA256: ${{ inputs.candidate_bundle_sha256 }}
        shell: bash
        run: |
          [[ "$NPM_NATIVE_VALIDATION" == true || "$NPM_NATIVE_VALIDATION" == false ]] || exit 1
          [[ "$CANDIDATE_REPLAY" == true || "$CANDIDATE_REPLAY" == false ]] || exit 1
          if [[ "$CANDIDATE_REPLAY" == true ]]; then
            test "$NPM_NATIVE_VALIDATION" = false
            test -z "$NPM_CANDIDATE_TAG"
            test -z "$NPM_MANIFEST_SHA256"
            test -z "$NPM_SOURCE_SHA"
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REPOSITORY" = ZhengyiLuo/AgentsDock
            [[ "$GITHUB_REF" =~ ^refs/heads/release/[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || exit 1
            git check-ref-format "$GITHUB_REF"
            test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/ci.yml@$GITHUB_REF"
            [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
            [[ "$CANDIDATE_TAG" =~ ^candidate-replay-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.[1-9][0-9]*$ ]] || exit 1
            [[ "$CANDIDATE_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ && "$CANDIDATE_BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
            exit 0
          fi
          test -z "$CANDIDATE_TAG"
          test -z "$CANDIDATE_RECEIPT_SHA256"
          test -z "$CANDIDATE_BUNDLE_SHA256"
          if [[ "$NPM_NATIVE_VALIDATION" == false ]]; then
            test -z "$NPM_CANDIDATE_TAG"
            test -z "$NPM_MANIFEST_SHA256"
            test -z "$NPM_SOURCE_SHA"
            exit 0
          fi
          test "$NPM_NATIVE_VALIDATION" = true
          test "$CANDIDATE_REPLAY" = false
          test -z "$CANDIDATE_TAG"
          test -z "$CANDIDATE_RECEIPT_SHA256"
          test -z "$CANDIDATE_BUNDLE_SHA256"
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = ZhengyiLuo/AgentsDock
          [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" =~ ^refs/heads/release/[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || exit 1
          git check-ref-format "$GITHUB_REF"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/ci.yml@$GITHUB_REF"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$NPM_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$NPM_CANDIDATE_TAG" =~ ^npm-candidate-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.[1-9][0-9]*)?$ ]] || exit 1
          [[ "$NPM_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test release identities, channels, immutable retries and workflow contracts
        run: node --test scripts/tests/*.test.mjs server/npm/cli.test.cjs
      - name: Exercise offline server packaging with disposable sources and fixture keys
        run: |
          command -v git npm openssl python3
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 -m unittest discover -s server/tests -t server -p test_npm_release_package.py
          python3 -m unittest discover -s server/tests -t server -p test_release_file_manifest_isolated.py

  electron:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.npm_native_validation) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: electron/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: electron
      - name: Materialize Electron runtime before parallel test imports
        run: node node_modules/electron/install.js
        working-directory: electron
      - run: pnpm typecheck
        working-directory: electron
      - run: pnpm test
        working-directory: electron
      - run: pnpm build
        working-directory: electron

  mobile-source:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.npm_native_validation) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile-react/pnpm-lock.yaml
      # Keep source validation independent of native generation and signing.
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: mobile-react
      - run: pnpm typecheck
        working-directory: mobile-react
      - run: pnpm test:history
        working-directory: mobile-react
      - run: pnpm test:server-setup
        working-directory: mobile-react
      - run: node scripts/run-history-tests.mjs src/lib/team-references.test.ts
        working-directory: mobile-react
      - name: Verify cross-chat protocol, projection, and store races
        run: |
          node scripts/run-history-tests.mjs src/lib/cross-chat-protocol.test.ts --native-mocks
          node scripts/run-history-tests.mjs src/lib/timeline-async-messages.test.ts --native-mocks
          node scripts/run-history-tests.mjs src/store/useAppStore.cross-chat-routes.test.ts --native-mocks
        working-directory: mobile-react
      - name: Verify cross-chat rendering and control interactions
        run: >-
          node --test
          tests/async-cross-chat-message-rendering.test.mjs
          tests/team-mention-composer.test.mjs
          tests/cross-chat-card-interactions.test.mjs
          tests/imported-cross-chat-rendering.test.mjs
          tests/cross-chat-composer-ui-contract.test.mjs
          tests/cross-chat-store-contract.test.mjs
          tests/cross-chat-timeline-ui-contract.test.mjs
        working-directory: mobile-react
      - run: node --test tests/ios-release-metadata.test.mjs
        working-directory: mobile-react
      - run: node --test tests/ios-workspace-resolution.test.mjs
        working-directory: mobile-react

  npm-native:
    # Scoped npm validation is not desktop/mobile or legacy product acceptance.
    if: github.event_name == 'workflow_dispatch' && inputs.npm_native_validation && !inputs.candidate_replay && github.repository == 'ZhengyiLuo/AgentsDock' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    needs: [release-tooling]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
          - runner: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: write # GitHub requires push access to read an unpublished draft.
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NPM_NATIVE_VALIDATION: ${{ inputs.npm_native_validation }}
      CANDIDATE_REPLAY: 'false'
      NPM_CANDIDATE_TAG: ${{ inputs.npm_candidate_tag }}
      NPM_MANIFEST_SHA256: ${{ inputs.npm_manifest_sha256 }}
      NPM_SOURCE_SHA: ${{ inputs.npm_source_sha }}
      TEST_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download only the exact canonical npm draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat server/VERSION)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.[1-9][0-9]*)?$ ]] || exit 1
          test "$NPM_CANDIDATE_TAG" = "npm-candidate-v$version"
          mkdir "$RUNNER_TEMP/npm-native-inputs"
          mkdir "$RUNNER_TEMP/npm-native-inputs/npm"
          gh release view "$NPM_CANDIDATE_TAG" --repo ZhengyiLuo/AgentsDock \
            --json tagName,isDraft,targetCommitish,body,assets > "$RUNNER_TEMP/npm-native-inputs/release.json"
          gh release download "$NPM_CANDIDATE_TAG" --repo ZhengyiLuo/AgentsDock \
            --dir "$RUNNER_TEMP/npm-native-inputs/npm" \
            --pattern agents-server-npm-manifest.json --pattern agents-server-npm-manifest.sig --pattern "server-$version.tgz"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Prepare disposable native npm prerequisites
        run: |
          uv python install 3.13
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y tmux
            sudo loginctl enable-linger "$(id -un)"
            systemctl --user show-environment > /dev/null
          else
            command -v tmux || brew install tmux
            /bin/launchctl print "gui/$(id -u)" > /dev/null
          fi
      - name: Verify draft identity and signed bytes before real native npm validation
        run: |
          umask 022
          mkdir "$RUNNER_TEMP/npm-native-public"
          python3 scripts/npm_native_acceptance.py \
            --assets "$RUNNER_TEMP/npm-native-inputs/npm" \
            --release "$RUNNER_TEMP/npm-native-inputs/release.json" \
            --source-sha "$NPM_SOURCE_SHA" --source-ref "$GITHUB_REF_NAME" \
            --manifest-sha256 "$NPM_MANIFEST_SHA256" \
            --work "$RUNNER_TEMP/agentsdock-npm-native-$TEST_PLATFORM" \
            --report "$RUNNER_TEMP/npm-native-public/report-$TEST_PLATFORM.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: npm-native-validation-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/npm-native-public/report-${{ matrix.platform }}.json
          if-no-files-found: warn
          retention-days: 14

# Npm native validation installs only on disposable hosted runners.

  candidate-native:
    # This existing registered workflow may be explicitly dispatched on a reviewed
    # release branch before the separate production acceptance workflow is merged.
    # Its observations are deliberately ineligible for production publication.
    if: github.event_name == 'workflow_dispatch' && inputs.candidate_replay && !inputs.npm_native_validation && github.repository == 'ZhengyiLuo/AgentsDock' && startsWith(github.ref, 'refs/heads/release/')
    needs: [release-tooling, electron, mobile-source]
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: fresh
            legacy_mode: '0755'
          - kind: legacy
            legacy_mode: '0755'
          - kind: legacy
            legacy_mode: '0750'
          - kind: recovery
            legacy_mode: '0755'
          - kind: recovery
            legacy_mode: '0750'
          - kind: stage-recovery
            legacy_mode: '0755'
          - kind: stage-recovery
            legacy_mode: '0750'
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: write # GitHub requires push access to read an unpublished draft.
      actions: read
    defaults:
      run:
        shell: bash
    env:
      RECEIPT_SHA256: ${{ inputs.candidate_receipt_sha256 }}
      LEGACY_MODE: ${{ matrix.legacy_mode }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # Prove any test-harness retry descends from the immutable packaged source.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Prepare disposable native prerequisites
        run: |
          uv python install 3.13
          command -v tmux || brew install tmux
          /bin/launchctl print "gui/$(id -u)" > /dev/null
      - uses: ./.github/actions/product-candidate-inputs
        id: candidate
        with:
          candidate_tag: ${{ inputs.candidate_tag }}
          receipt_sha256: ${{ inputs.candidate_receipt_sha256 }}
          bundle_sha256: ${{ inputs.candidate_bundle_sha256 }}
          github_token: ${{ github.token }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        if: matrix.kind == 'legacy'
        with:
          version: 11.9.0
          run_install: false
      - name: Verify signed universal app, DMG, notarization, updater metadata and native launch
        if: matrix.kind == 'legacy'
        env:
          PRODUCT_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          pnpm --dir electron install --frozen-lockfile --ignore-scripts
          export AGENTSDOCK_EXPECTED_BUILD_NUMBER="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1])).buildNumber' "$RUNNER_TEMP/candidate-inputs/candidate.json")"
          export AGENTSDOCK_COORDINATED_MANIFEST="$RUNNER_TEMP/candidate-inputs/payload/server/npm/agents-server-npm-manifest.json"
          export AGENTSDOCK_COORDINATED_SIGNATURE="$RUNNER_TEMP/candidate-inputs/payload/server/npm/agents-server-npm-manifest.sig"
          scripts/verify_electron_release.sh "$RUNNER_TEMP/candidate-inputs/payload/desktop" "$PRODUCT_VERSION" beta
      - name: Install the exact npm candidate or signed legacy baseline
        env:
          CANDIDATE_KIND: ${{ matrix.kind }}
        run: |
          umask 022
          extra=()
          INSTALL_KIND="$CANDIDATE_KIND"
          if [[ "$CANDIDATE_KIND" == recovery ]]; then INSTALL_KIND=legacy; fi
          if [[ "$CANDIDATE_KIND" == stage-recovery ]]; then INSTALL_KIND=legacy; fi
          if [[ "$INSTALL_KIND" == legacy ]]; then
            extra=(--baseline-archive "$RUNNER_TEMP/candidate-inputs/baseline-server/agents-server-1.0.7-beta.21.tar.gz"
              --baseline-manifest "$RUNNER_TEMP/candidate-inputs/baseline-server/agents-server-manifest.json"
              --baseline-signature "$RUNNER_TEMP/candidate-inputs/baseline-server/agents-server-manifest.sig" --legacy-root-mode "$LEGACY_MODE")
          fi
          if [[ "$CANDIDATE_KIND" == stage-recovery ]]; then extra+=(--staging-failure-fixture); fi
          python3 scripts/product_server_acceptance.py bootstrap --candidate --kind "$INSTALL_KIND" \
            --receipt "$RUNNER_TEMP/candidate-inputs/candidate.json" --receipt-sha256 "$RECEIPT_SHA256" \
            --bundle "$RUNNER_TEMP/candidate-inputs/payload/server" --work "$RUNNER_TEMP/agentsdock-acceptance-candidate" \
            --fixture "$RUNNER_TEMP/agentsdock-acceptance-candidate/server.json" \
            --evidence "$RUNNER_TEMP/agentsdock-acceptance-candidate/bootstrap.json" "${extra[@]}"
      - name: Configure exact-origin replay only after all signatures and provenance pass
        if: matrix.kind != 'fresh'
        env:
          CANDIDATE_KIND: ${{ matrix.kind }}
        run: |
          python3 scripts/product_acceptance_network.py setup --candidate \
            --receipt "$RUNNER_TEMP/candidate-inputs/candidate.json" --receipt-sha256 "$RECEIPT_SHA256" \
            --work "$RUNNER_TEMP/agentsdock-acceptance-network"
          set -a
          source "$RUNNER_TEMP/agentsdock-acceptance-network/trust.env"
          set +a
          /bin/launchctl setenv SSL_CERT_FILE "$SSL_CERT_FILE"
          /bin/launchctl setenv NODE_EXTRA_CA_CERTS "$NODE_EXTRA_CA_CERTS"
          # The signed legacy server strips CA hints when starting a new tmux
          # daemon. Keep this disposable runner's default daemon alive BEFORE
          # injecting replay trust. This owned sleeper is only TLS plumbing;
          # it is never evidence of a running provider job or busy-update drain.
          REPLAY_TMUX_SESSION="agentsdock-replay-trust-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          env -i HOME="$HOME" USER="$USER" LOGNAME="$LOGNAME" PATH="$PATH" TMPDIR="$TMPDIR" SHELL=/bin/bash \
            tmux new-session -d -s "$REPLAY_TMUX_SESSION" -P -F '#{session_id}' 'exec /bin/sleep 5400' \
            > "$RUNNER_TEMP/agentsdock-acceptance-network/tmux-session-id"
          tmux set-environment -g SSL_CERT_FILE "$SSL_CERT_FILE"
          tmux set-environment -g NODE_EXTRA_CA_CERTS "$NODE_EXTRA_CA_CERTS"
          [[ "$(tmux show-environment -g SSL_CERT_FILE)" == "SSL_CERT_FILE=$SSL_CERT_FILE" ]]
          [[ "$(tmux show-environment -g NODE_EXTRA_CA_CERTS)" == "NODE_EXTRA_CA_CERTS=$NODE_EXTRA_CA_CERTS" ]]
          python3 scripts/product_server_acceptance.py service --candidate --action restart \
            --receipt "$RUNNER_TEMP/candidate-inputs/candidate.json" --receipt-sha256 "$RECEIPT_SHA256" \
            --bundle "$RUNNER_TEMP/candidate-inputs/payload/server" --work "$RUNNER_TEMP/agentsdock-acceptance-candidate" \
            --fixture "$RUNNER_TEMP/agentsdock-acceptance-candidate/server.json" \
            --evidence "$RUNNER_TEMP/agentsdock-acceptance-candidate/restarted.json"
          fault_args=()
          if [[ "$CANDIDATE_KIND" == recovery ]]; then
            fault_args=(--fault-control "$RUNNER_TEMP/agentsdock-acceptance-candidate/fault.json"
              --fault-observed "$RUNNER_TEMP/agentsdock-acceptance-candidate/fault-observed.json")
          fi
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_OS="$RUNNER_OS" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_SHA="$GITHUB_SHA" RUNNER_TEMP="$RUNNER_TEMP" \
            "$(command -v node)" scripts/product-release-replay.mjs serve --scope candidate \
            --receipt "$RUNNER_TEMP/candidate-inputs/candidate.json" --receipt-sha256 "$RECEIPT_SHA256" \
            --server-assets "$RUNNER_TEMP/candidate-inputs/payload/server" --desktop-assets "$RUNNER_TEMP/candidate-inputs/payload/desktop" \
            --baseline-desktop "$RUNNER_TEMP/candidate-inputs/baseline-desktop" --baseline-version 1.0.6 \
            --certificate "$RUNNER_TEMP/agentsdock-acceptance-network/leaf.pem" \
            --private-key "$RUNNER_TEMP/agentsdock-acceptance-network/leaf.key" \
            --pid-file "$RUNNER_TEMP/agentsdock-acceptance-network/replay.pid" "${fault_args[@]}" \
            > "$RUNNER_TEMP/agentsdock-acceptance-network/replay.log" 2>&1 &
          REPLAY_LAUNCHER_PID=$!
          for attempt in {1..20}; do
            if node --input-type=module - "$RUNNER_TEMP/agentsdock-acceptance-network/replay.log" \
              "$RUNNER_TEMP/agentsdock-acceptance-network/replay.pid" \
              "$RUNNER_TEMP/agentsdock-acceptance-network/ca.pem" \
              "$RUNNER_TEMP/agentsdock-acceptance-network/leaf.pem" \
              "$RUNNER_TEMP/agentsdock-acceptance-network/origin-probe.json" <<'NODE'
          import { writeFile } from 'node:fs/promises'
          import { assertReplayReadiness, probeReplayOrigin } from './scripts/product-release-replay.mjs'
          try {
            const nodeProbe = await probeReplayOrigin({caPath: process.argv[4], expectedLeafPath: process.argv[5]})
            await writeFile(process.argv[6], JSON.stringify(nodeProbe), {mode: 0o600})
            await assertReplayReadiness({logPath: process.argv[2], pidPath: process.argv[3], nodeProbe})
          }
          catch { process.exitCode = 1 }
          NODE
            then exit 0; fi
            sleep 1
          done
          # Curl is an independent diagnostic, not a substitute for the verified
          # Node HTTPS probe or the real Electron updater's unchanged TLS checks.
          READINESS_CURL_STATUS=0
          if curl --fail --silent --max-time 5 --cacert "$RUNNER_TEMP/agentsdock-acceptance-network/ca.pem" \
            --dump-header "$RUNNER_TEMP/agentsdock-acceptance-network/readiness.headers" --output /dev/null \
            --write-out '%{remote_ip}|%{ssl_verify_result}|%{http_code}\n' \
            https://github.com/ZhengyiLuo/AgentsDock/releases.atom \
            > "$RUNNER_TEMP/agentsdock-acceptance-network/readiness.metadata"; then
            READINESS_CURL_STATUS=0
          else READINESS_CURL_STATUS=$?; fi
          curl --version
          openssl version
          REPLAY_LAUNCHER_PRESENT=false
          if /bin/ps -p "$REPLAY_LAUNCHER_PID" -o pid= > /dev/null; then REPLAY_LAUNCHER_PRESENT=true; fi
          node --input-type=module - "$RUNNER_TEMP/agentsdock-acceptance-network/replay.log" \
            "$READINESS_CURL_STATUS" "$REPLAY_LAUNCHER_PRESENT" \
            "$RUNNER_TEMP/agentsdock-acceptance-network/readiness.metadata" \
            "$RUNNER_TEMP/agentsdock-acceptance-network/readiness.headers" \
            "$RUNNER_TEMP/agentsdock-acceptance-network/origin-probe.json" <<'NODE'
          import { constants, openSync, fstatSync, readSync, closeSync } from 'node:fs'
          import { parseReplayStartupDiagnostics, parseReplayProbeDiagnostics, parseReplayOriginProbe } from './scripts/product-release-replay.mjs'
          const status = Number(process.argv[3])
          const summary = { kind: 'replay-readiness', curlExitCode: Number.isInteger(status) && status >= 0 && status <= 255 ? status : null,
            launcherPresent: process.argv[4] === 'true' }
          function bounded(path) {
            const fd = openSync(path, constants.O_RDONLY | constants.O_NOFOLLOW)
            try {
              const stat = fstatSync(fd)
              if (!stat.isFile() || stat.size > 32768) throw new Error('Unbounded diagnostic input')
              const buffer = Buffer.alloc(32769)
              const count = readSync(fd, buffer, 0, buffer.length, 0)
              return buffer.subarray(0, count)
            } finally { closeSync(fd) }
          }
          try { summary.startup = parseReplayStartupDiagnostics(bounded(process.argv[2])) }
          catch { summary.diagnosticsUnavailable = true }
          try { summary.probe = parseReplayProbeDiagnostics(bounded(process.argv[5]), bounded(process.argv[6])) }
          catch { summary.probeDiagnosticsUnavailable = true }
          try { summary.nodeProbe = parseReplayOriginProbe(bounded(process.argv[7])) }
          catch { summary.nodeProbeDiagnosticsUnavailable = true }
          console.log(JSON.stringify(summary))
          NODE
          echo 'Candidate replay did not become ready.' >&2
          exit 1
      - name: Real update click, native replacement, and saved-server reconciliation
        if: matrix.kind == 'legacy'
        run: |
          set -a
          source "$RUNNER_TEMP/agentsdock-acceptance-network/trust.env"
          set +a
          node scripts/product_desktop_acceptance.mjs --scope candidate \
            --receipt "$RUNNER_TEMP/candidate-inputs/candidate.json" --receipt-sha256 "$RECEIPT_SHA256" \
            --server-directory "$RUNNER_TEMP/candidate-inputs/payload/server" --desktop-directory "$RUNNER_TEMP/candidate-inputs/payload/desktop" \
            --baseline-directory "$RUNNER_TEMP/candidate-inputs/baseline-desktop" --baseline-version 1.0.6 \
            --server-fixture "$RUNNER_TEMP/agentsdock-acceptance-candidate/server.json" \
            --output "$RUNNER_TEMP/agentsdock-acceptance-candidate/desktop"
      - name: Interrupt the exact signed legacy transfer, preserve incumbent state, and retry
        if: matrix.kind == 'recovery'
        run: |
          set -a
          source "$RUNNER_TEMP/agentsdock-acceptance-network/trust.env"
          set +a
          python3 scripts/product_server_acceptance.py failure-retry --candidate --kind legacy \
            --receipt "$RUNNER_TEMP/candidate-inputs/candidate.json" --receipt-sha256 "$RECEIPT_SHA256" \
            --bundle "$RUNNER_TEMP/candidate-inputs/payload/server" --work "$RUNNER_TEMP/agentsdock-acceptance-candidate" \
            --fixture "$RUNNER_TEMP/agentsdock-acceptance-candidate/server.json" \
            --evidence "$RUNNER_TEMP/agentsdock-acceptance-candidate/recovery.json" \
            --fault-control "$RUNNER_TEMP/agentsdock-acceptance-candidate/fault.json" \
            --fault-observed "$RUNNER_TEMP/agentsdock-acceptance-candidate/fault-observed.json"
      - name: Fail exact candidate preparation, observe natural stage cleanup, and retry
        if: matrix.kind == 'stage-recovery'
        run: |
          set -a
          source "$RUNNER_TEMP/agentsdock-acceptance-network/trust.env"
          set +a
          python3 scripts/product_server_acceptance.py staging-failure-retry --candidate --kind legacy \
            --receipt "$RUNNER_TEMP/candidate-inputs/candidate.json" --receipt-sha256 "$RECEIPT_SHA256" \
            --bundle "$RUNNER_TEMP/candidate-inputs/payload/server" --work "$RUNNER_TEMP/agentsdock-acceptance-candidate" \
            --fixture "$RUNNER_TEMP/agentsdock-acceptance-candidate/server.json" \
            --evidence "$RUNNER_TEMP/agentsdock-acceptance-candidate/stage-recovery.json"
      - name: Inspect failed owned recovery service without exposing private logs
        if: failure() && (matrix.kind == 'recovery' || matrix.kind == 'stage-recovery')
        timeout-minutes: 3
        run: |
          if [[ -f "$RUNNER_TEMP/agentsdock-acceptance-candidate/server.json" ]]; then
            if ! python3 scripts/product_server_acceptance.py diagnose --candidate --kind legacy \
              --receipt "$RUNNER_TEMP/candidate-inputs/candidate.json" --receipt-sha256 "$RECEIPT_SHA256" \
              --bundle "$RUNNER_TEMP/candidate-inputs/payload/server" --work "$RUNNER_TEMP/agentsdock-acceptance-candidate" \
              --fixture "$RUNNER_TEMP/agentsdock-acceptance-candidate/server.json" \
              --evidence "$RUNNER_TEMP/agentsdock-acceptance-candidate/recovery-diagnostics.json" \
              > "$RUNNER_TEMP/agentsdock-acceptance-candidate/diagnostics-private.log" 2>&1; then
              echo 'Bounded recovery diagnostics unavailable.'
            fi
          fi
      - name: Restore disposable routing and trust before artifact upload
        if: always() && matrix.kind != 'fresh'
        run: |
          /bin/launchctl unsetenv SSL_CERT_FILE
          /bin/launchctl unsetenv NODE_EXTRA_CA_CERTS
          if tmux show-environment -g > /dev/null 2>&1; then
            tmux set-environment -gu SSL_CERT_FILE
            tmux set-environment -gu NODE_EXTRA_CA_CERTS
          fi
          REPLAY_TMUX_CLEANUP_OK=true
          if [[ -s "$RUNNER_TEMP/agentsdock-acceptance-network/tmux-session-id" ]]; then
            # Check both native session ID and exact run-owned name. Never kill
            # the default daemon, another session, or the chat's live terminal.
            (
              REPLAY_TMUX_ID="$(cat "$RUNNER_TEMP/agentsdock-acceptance-network/tmux-session-id")"
              [[ "$REPLAY_TMUX_ID" =~ ^\$[0-9]+$ ]] || exit 1
              if tmux has-session -t "$REPLAY_TMUX_ID" 2>/dev/null; then
                [[ "$(tmux display-message -p -t "$REPLAY_TMUX_ID" '#{session_name}')" == "agentsdock-replay-trust-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" ]] || exit 1
                tmux kill-session -t "$REPLAY_TMUX_ID" || exit 1
              fi
            ) || REPLAY_TMUX_CLEANUP_OK=false
          fi
          if [[ -f "$RUNNER_TEMP/agentsdock-acceptance-network/replay.pid" ]]; then
            REPLAY_PID="$(cat "$RUNNER_TEMP/agentsdock-acceptance-network/replay.pid")"
            [[ "$REPLAY_PID" =~ ^[1-9][0-9]*$ ]]
            if ps -p "$REPLAY_PID" -o command= | grep -F 'scripts/product-release-replay.mjs serve' | grep -F "$RUNNER_TEMP/agentsdock-acceptance-network/leaf.key" > /dev/null; then
              kill -TERM "$REPLAY_PID"
            fi
          fi
          if [[ -f "$RUNNER_TEMP/agentsdock-acceptance-network/owner.json" ]]; then
            python3 scripts/product_acceptance_network.py teardown --candidate --work "$RUNNER_TEMP/agentsdock-acceptance-network"
          fi
          [[ "$REPLAY_TMUX_CLEANUP_OK" == true ]]
      - name: Collect bounded public observations, never credentials or private fixture logs
        if: always()
        run: |
          node --input-type=module - "$RUNNER_TEMP/agentsdock-acceptance-candidate" "$RUNNER_TEMP/candidate-public-evidence" <<'NODE'
          import { constants, openSync, fstatSync, readSync, closeSync, mkdirSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          const [source, destination] = process.argv.slice(2)
          mkdirSync(destination, { mode: 0o700 })
          const pairs = [['bootstrap.json', 'server.json'], ['recovery.json', 'recovery.json'], ['stage-recovery.json', 'stage-recovery.json'],
            ['recovery-diagnostics.json', 'recovery-diagnostics.json'], ['desktop/desktop-evidence.json', 'desktop.json'],
            ['desktop/server-preservation.json', 'server-preservation.json'], ['desktop/failure-observations.json', 'failure.json'],
            ['desktop/server-diagnostics.json', 'server-diagnostics.json']]
          let copied = 0
          try {
            for (const [input, output] of pairs) {
              let fd
              try { fd = openSync(join(source, input), constants.O_RDONLY | constants.O_NOFOLLOW) }
              catch (error) { if (error.code === 'ENOENT') continue; throw error }
              let bytes
              try {
                const stat = fstatSync(fd)
                if (!stat.isFile() || stat.uid !== process.getuid() || stat.size > 512 * 1024) throw new Error('Invalid public evidence file')
                const buffer = Buffer.alloc(512 * 1024 + 1)
                const count = readSync(fd, buffer, 0, buffer.length, 0)
                if (count > 512 * 1024 || count !== stat.size) throw new Error('Unbounded public evidence')
                bytes = buffer.subarray(0, count)
                const report = JSON.parse(bytes)
                if (/"(?:token|password|authorization|privateKey|cookie)"\s*:/i.test(bytes.toString('utf8'))) throw new Error('Private fields in public evidence')
                if ((input === 'recovery.json' || input === 'stage-recovery.json' || input === 'recovery-diagnostics.json')
                  && (report.kind !== 'candidate-server-observations' || report.publicationEligible !== false || report.releaseAcceptance !== false)) {
                  throw new Error('Recovery rehearsal cannot emit production acceptance')
                }
              } finally { closeSync(fd) }
              writeFileSync(join(destination, output), bytes, { flag: 'wx', mode: 0o600 })
              copied++
            }
            console.log(JSON.stringify({ publicEvidenceFiles: copied }))
          } catch { console.error('Candidate evidence collection failed safely.'); process.exitCode = 1 }
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: candidate-replay-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.kind }}-${{ matrix.legacy_mode }}
          path: ${{ runner.temp }}/candidate-public-evidence/*.json
          if-no-files-found: warn
          retention-days: 14

  candidate-no-downgrade:
    # Separate genuine newer-server fixture: never relax positive upgrade guards.
    if: github.event_name == 'workflow_dispatch' && inputs.candidate_replay && !inputs.npm_native_validation && github.repository == 'ZhengyiLuo/AgentsDock' && startsWith(github.ref, 'refs/heads/release/')
    needs: [release-tooling, electron, mobile-source]
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write # Required to read the two unpublished, independently pinned drafts.
      actions: read
    defaults:
      run:
        shell: bash
    env:
      RECEIPT_SHA256: ${{ inputs.candidate_receipt_sha256 }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Prepare disposable no-downgrade prerequisites
        run: |
          uv python install 3.13
          command -v tmux || brew install tmux
          /bin/launchctl print "gui/$(id -u)" > /dev/null
      - uses: ./.github/actions/product-candidate-inputs
        id: candidate
        with:
          candidate_tag: ${{ inputs.candidate_tag }}
          receipt_sha256: ${{ inputs.candidate_receipt_sha256 }}
          bundle_sha256: ${{ inputs.candidate_bundle_sha256 }}
          github_token: ${{ github.token }}
      - name: Download the genuine separately signed stable server and compare published registry bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          mkdir "$RUNNER_TEMP/no-downgrade-stable"
          gh release download npm-candidate-v1.0.8 --repo ZhengyiLuo/AgentsDock \
            --pattern server-1.0.8.tgz --pattern agents-server-npm-manifest.json --pattern agents-server-npm-manifest.sig \
            --dir "$RUNNER_TEMP/no-downgrade-stable"
          STATUS="$(curl --disable --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 300 \
            --output "$RUNNER_TEMP/no-downgrade-registry-server-1.0.8.tgz" --write-out '%{http_code}' \
            https://registry.npmjs.org/@agentsdock/server/-/server-1.0.8.tgz)"
          test "$STATUS" = 200
          cmp "$RUNNER_TEMP/no-downgrade-stable/server-1.0.8.tgz" "$RUNNER_TEMP/no-downgrade-registry-server-1.0.8.tgz"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.9.0
          run_install: false
      - name: Verify the unmodified signed beta app before isolated native use
        env:
          PRODUCT_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          pnpm --dir electron install --frozen-lockfile --ignore-scripts
          export AGENTSDOCK_EXPECTED_BUILD_NUMBER="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1])).buildNumber' "$RUNNER_TEMP/candidate-inputs/candidate.json")"
          export AGENTSDOCK_COORDINATED_MANIFEST="$RUNNER_TEMP/candidate-inputs/payload/server/npm/agents-server-npm-manifest.json"
          export AGENTSDOCK_COORDINATED_SIGNATURE="$RUNNER_TEMP/candidate-inputs/payload/server/npm/agents-server-npm-manifest.sig"
          scripts/verify_electron_release.sh "$RUNNER_TEMP/candidate-inputs/payload/desktop" "$PRODUCT_VERSION" beta
      - name: Verify independent stable pins and install the real stable fixture
        run: |
          python3 scripts/product_no_downgrade_server.py bootstrap \
            --receipt "$RUNNER_TEMP/candidate-inputs/candidate.json" --receipt-sha256 "$RECEIPT_SHA256" \
            --server-directory "$RUNNER_TEMP/candidate-inputs/payload/server" \
            --desktop-directory "$RUNNER_TEMP/candidate-inputs/payload/desktop" \
            --stable-directory "$RUNNER_TEMP/no-downgrade-stable" \
            --work "$RUNNER_TEMP/agentsdock-acceptance-no-downgrade" \
            --fixture "$RUNNER_TEMP/agentsdock-acceptance-no-downgrade/server.json" \
            --evidence "$RUNNER_TEMP/agentsdock-acceptance-no-downgrade/bootstrap.json"
      - name: Observe the actual beta app without downgrading the newer stable server
        run: |
          node scripts/product_no_downgrade_desktop.mjs \
            --receipt "$RUNNER_TEMP/candidate-inputs/candidate.json" --receipt-sha256 "$RECEIPT_SHA256" \
            --server-directory "$RUNNER_TEMP/candidate-inputs/payload/server" \
            --desktop-directory "$RUNNER_TEMP/candidate-inputs/payload/desktop" \
            --stable-directory "$RUNNER_TEMP/no-downgrade-stable" \
            --work "$RUNNER_TEMP/agentsdock-acceptance-no-downgrade" \
            --fixture "$RUNNER_TEMP/agentsdock-acceptance-no-downgrade/server.json" \
            --output "$RUNNER_TEMP/agentsdock-acceptance-no-downgrade/desktop"
      - name: Collect only bounded non-publishing no-downgrade observations
        if: always()
        run: |
          node --input-type=module - "$RUNNER_TEMP/agentsdock-acceptance-no-downgrade" "$RUNNER_TEMP/no-downgrade-public" <<'NODE'
          import { constants, openSync, fstatSync, readSync, closeSync, mkdirSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          const [source, destination] = process.argv.slice(2)
          mkdirSync(destination, { mode: 0o700 })
          const pairs = [['bootstrap.json', 'stable-bootstrap.json'], ['desktop/no-downgrade.json', 'no-downgrade.json'],
            ['desktop/service-verification.json', 'stable-verification.json']]
          let copied = 0
          try {
            for (const [input, output] of pairs) {
              let fd
              try { fd = openSync(join(source, input), constants.O_RDONLY | constants.O_NOFOLLOW) }
              catch (error) { if (error.code === 'ENOENT') continue; throw error }
              let bytes
              try {
                const stat = fstatSync(fd)
                if (!stat.isFile() || stat.uid !== process.getuid() || stat.size > 512 * 1024) throw new Error('Invalid observation file')
                const buffer = Buffer.alloc(512 * 1024 + 1)
                const count = readSync(fd, buffer, 0, buffer.length, 0)
                if (count > 512 * 1024 || count !== stat.size) throw new Error('Unbounded observations')
                bytes = buffer.subarray(0, count)
                const report = JSON.parse(bytes)
                if (/"(?:token|password|authorization|privateKey|cookie)"\s*:/i.test(bytes.toString('utf8'))) throw new Error('Private observation fields')
                if (report.kind !== 'candidate-no-downgrade-observations' || report.publicationEligible !== false
                  || report.releaseAcceptance !== false) throw new Error('Not scoped no-downgrade observations')
              } finally { closeSync(fd) }
              writeFileSync(join(destination, output), bytes, { flag: 'wx', mode: 0o600 })
              copied++
            }
            console.log(JSON.stringify({ publicEvidenceFiles: copied }))
          } catch { console.error('No-downgrade evidence collection failed safely.'); process.exitCode = 1 }
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: candidate-no-downgrade-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/no-downgrade-public/*.json
          if-no-files-found: warn
          retention-days: 14

# The optional rehearsal contains no signing credentials or publishing commands.
# Only product-release-acceptance.yml can supply production acceptance evidence.
