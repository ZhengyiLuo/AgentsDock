name: Verify source

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      npm_native_validation:
        description: Validate only the signed npm draft on disposable macOS and Linux hosts; not product acceptance
        type: boolean
        default: false
      npm_candidate_tag:
        description: Exact unpublished npm-candidate-vVERSION tag for npm-only validation
        type: string
        default: ''
      npm_manifest_sha256:
        description: Independently reviewed npm descriptor SHA-256 for npm-only validation
        type: string
        default: ''
      npm_source_sha:
        description: Exact signed npm candidate source SHA; required for npm-only validation and distinct from the harness commit
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: verify-source-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.npm_native_validation && '-npm-native' || '' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.npm_native_validation) }}

jobs:

  release-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Validate manual npm-native inputs before any installation
        if: github.event_name == 'workflow_dispatch'
        env:
          NPM_NATIVE_VALIDATION: ${{ inputs.npm_native_validation }}
          CANDIDATE_REPLAY: 'false'
          NPM_CANDIDATE_TAG: ${{ inputs.npm_candidate_tag }}
          NPM_MANIFEST_SHA256: ${{ inputs.npm_manifest_sha256 }}
          NPM_SOURCE_SHA: ${{ inputs.npm_source_sha }}
          CANDIDATE_TAG: ''
          CANDIDATE_RECEIPT_SHA256: ''
          CANDIDATE_BUNDLE_SHA256: ''
        shell: bash
        run: |
          [[ "$NPM_NATIVE_VALIDATION" == true || "$NPM_NATIVE_VALIDATION" == false ]] || exit 1
          [[ "$CANDIDATE_REPLAY" == true || "$CANDIDATE_REPLAY" == false ]] || exit 1
          test "$CANDIDATE_REPLAY" = false
          test -z "$CANDIDATE_TAG"
          test -z "$CANDIDATE_RECEIPT_SHA256"
          test -z "$CANDIDATE_BUNDLE_SHA256"
          if [[ "$NPM_NATIVE_VALIDATION" == false ]]; then
            test -z "$NPM_CANDIDATE_TAG"
            test -z "$NPM_MANIFEST_SHA256"
            test -z "$NPM_SOURCE_SHA"
            exit 0
          fi
          test "$NPM_NATIVE_VALIDATION" = true
          test "$CANDIDATE_REPLAY" = false
          test -z "$CANDIDATE_TAG"
          test -z "$CANDIDATE_RECEIPT_SHA256"
          test -z "$CANDIDATE_BUNDLE_SHA256"
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = ZhengyiLuo/AgentsDock
          [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" =~ ^refs/heads/release/[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || exit 1
          git check-ref-format "$GITHUB_REF"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/ci.yml@$GITHUB_REF"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$NPM_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$NPM_CANDIDATE_TAG" =~ ^npm-candidate-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.[1-9][0-9]*)?$ ]] || exit 1
          [[ "$NPM_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test release identities, channels, immutable retries and workflow contracts
        run: node --test scripts/tests/*.test.mjs server/npm/cli.test.cjs
      - name: Exercise offline server packaging with disposable sources and fixture keys
        run: |
          command -v git npm openssl python3
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 -m unittest discover -s server/tests -t server -p test_npm_release_package.py
          python3 -m unittest discover -s server/tests -t server -p test_release_file_manifest_isolated.py

  electron:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.npm_native_validation) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: electron/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: electron
      - run: pnpm typecheck
        working-directory: electron
      - run: pnpm test
        working-directory: electron
      - run: pnpm build
        working-directory: electron

  mobile-source:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.npm_native_validation) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile-react/pnpm-lock.yaml
      # Keep source validation independent of native generation and signing.
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: mobile-react
      - run: pnpm typecheck
        working-directory: mobile-react
      - run: pnpm test:history
        working-directory: mobile-react
      - run: pnpm test:server-setup
        working-directory: mobile-react
      - run: node scripts/run-history-tests.mjs src/lib/team-references.test.ts
        working-directory: mobile-react
      - name: Verify cross-chat protocol, projection, and store races
        run: |
          node scripts/run-history-tests.mjs src/lib/cross-chat-protocol.test.ts --native-mocks
          node scripts/run-history-tests.mjs src/lib/timeline-async-messages.test.ts --native-mocks
          node scripts/run-history-tests.mjs src/store/useAppStore.cross-chat-routes.test.ts --native-mocks
        working-directory: mobile-react
      - name: Verify cross-chat rendering and control interactions
        run: >-
          node --test
          tests/async-cross-chat-message-rendering.test.mjs
          tests/team-mention-composer.test.mjs
          tests/cross-chat-card-interactions.test.mjs
          tests/imported-cross-chat-rendering.test.mjs
          tests/cross-chat-composer-ui-contract.test.mjs
          tests/cross-chat-store-contract.test.mjs
          tests/cross-chat-timeline-ui-contract.test.mjs
        working-directory: mobile-react
      - run: node --test tests/ios-release-metadata.test.mjs
        working-directory: mobile-react
      - run: node --test tests/ios-workspace-resolution.test.mjs
        working-directory: mobile-react

  npm-native:
    # Scoped npm validation is not desktop/mobile or legacy product acceptance.
    if: github.event_name == 'workflow_dispatch' && inputs.npm_native_validation && github.repository == 'ZhengyiLuo/AgentsDock' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    needs: [release-tooling]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
          - runner: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: write # GitHub requires push access to read an unpublished draft.
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NPM_NATIVE_VALIDATION: ${{ inputs.npm_native_validation }}
      CANDIDATE_REPLAY: 'false'
      NPM_CANDIDATE_TAG: ${{ inputs.npm_candidate_tag }}
      NPM_MANIFEST_SHA256: ${{ inputs.npm_manifest_sha256 }}
      NPM_SOURCE_SHA: ${{ inputs.npm_source_sha }}
      TEST_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download only the exact canonical npm draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat server/VERSION)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.[1-9][0-9]*)?$ ]] || exit 1
          test "$NPM_CANDIDATE_TAG" = "npm-candidate-v$version"
          mkdir "$RUNNER_TEMP/npm-native-inputs"
          mkdir "$RUNNER_TEMP/npm-native-inputs/npm"
          gh release view "$NPM_CANDIDATE_TAG" --repo ZhengyiLuo/AgentsDock \
            --json tagName,isDraft,targetCommitish,body,assets > "$RUNNER_TEMP/npm-native-inputs/release.json"
          gh release download "$NPM_CANDIDATE_TAG" --repo ZhengyiLuo/AgentsDock \
            --dir "$RUNNER_TEMP/npm-native-inputs/npm" \
            --pattern agents-server-npm-manifest.json --pattern agents-server-npm-manifest.sig --pattern "server-$version.tgz"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Prepare disposable native npm prerequisites
        run: |
          uv python install 3.13
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y tmux
            sudo loginctl enable-linger "$(id -un)"
            systemctl --user show-environment > /dev/null
          else
            command -v tmux || brew install tmux
            /bin/launchctl print "gui/$(id -u)" > /dev/null
          fi
      - name: Verify draft identity and signed bytes before real native npm validation
        run: |
          umask 022
          mkdir "$RUNNER_TEMP/npm-native-public"
          python3 scripts/npm_native_acceptance.py \
            --assets "$RUNNER_TEMP/npm-native-inputs/npm" \
            --release "$RUNNER_TEMP/npm-native-inputs/release.json" \
            --source-sha "$NPM_SOURCE_SHA" --source-ref "$GITHUB_REF_NAME" \
            --manifest-sha256 "$NPM_MANIFEST_SHA256" \
            --work "$RUNNER_TEMP/agentsdock-npm-native-$TEST_PLATFORM" \
            --report "$RUNNER_TEMP/npm-native-public/report-$TEST_PLATFORM.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: npm-native-validation-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/npm-native-public/report-${{ matrix.platform }}.json
          if-no-files-found: warn
          retention-days: 14

# Npm native validation installs only on disposable hosted runners.
