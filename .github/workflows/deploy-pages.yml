name: Deploy AgentsDock website

on:
  push:
    branches:
      - website-georgia
    paths:
      - "website/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: website-georgia

      - name: Validate static site
        shell: bash
        run: |
          test -s website/index.html
          test -s website/styles.css
          test -s website/app.js
          test "$(tr -d '\r\n' < website/CNAME)" = "agentsdock.net"
          jq -e '
            (.version | type == "string" and length > 0) and
            ([.platforms.macos, .platforms.linux] | all(
              .available == true and
              (.url | startswith("https://")) and
              (.sha256 | test("^[0-9a-f]{64}$"))
            ))
          ' website/releases/latest.json >/dev/null
          if grep -RInE 'testflight\.apple\.com/join/placeholder|/Users/' website --include='*.html' --include='*.js' --include='*.json'; then
            echo "Public-site placeholder or private path detected" >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
