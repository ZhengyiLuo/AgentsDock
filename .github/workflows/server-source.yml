name: Verify server source

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-server-source-${{ inputs.source_sha && format('product-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ !inputs.source_sha }}

jobs:
  server:
    name: Server tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        working-directory: server
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AGENTSDOCK_TEAM_HUB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Verify dependency lock and test
        env:
          AGENTS_SERVER_CONFIG_DIR: ${{ runner.temp }}/agentsdock-config
          AGENTSDOCK_STATE_DIR: ${{ runner.temp }}/agentsdock-state
          CODEX_SESSIONS_ROOT: ${{ runner.temp }}/codex-sessions
          CLAUDE_PROJECTS_ROOT: ${{ runner.temp }}/claude-projects
        run: |
          uv lock --check
          ulimit -s 65536
          PYTHONFAULTHANDLER=1 uv run --python 3.13 python -X faulthandler scripts/run_test_shard.py --index ${{ matrix.shard }} --count 8
