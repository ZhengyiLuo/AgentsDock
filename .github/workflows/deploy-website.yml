name: Deploy website to GitHub Pages

# Publishes the static site in website/ to GitHub Pages.
# Branch-based Pages sources can only serve the repo root or /docs, so this
# uploads website/ as the Pages artifact instead.
#
# Setup required in the repository settings:
#   1. Settings -> Pages -> Source = "GitHub Actions"
#   2. Settings -> Environments -> github-pages -> Deployment branches:
#      allow "website-georgia". Pages restricts this environment to the
#      default branch by default, and deploys from other branches fail with
#      "Branch is not allowed to deploy to github-pages due to environment
#      protection rules" until the branch is added.

on:
  push:
    branches: [website-georgia]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
