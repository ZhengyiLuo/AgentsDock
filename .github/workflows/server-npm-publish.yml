name: Prepare signed npm server release

# Preparation only. First publication and enabling OIDC publishing are separate
# reviewed actions after the npm package and its trusted publisher exist.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed commit SHA in this repository
        type: string
        required: true
      source_ref:
        description: Reviewed source branch (main or release/*)
        type: string
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: prepare-npm-server-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: npm-release
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the reviewed source pin
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
        shell: bash
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_REF" == main || "$SOURCE_REF" =~ ^release/[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]
          git check-ref-format "refs/heads/$SOURCE_REF"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags origin "refs/heads/$SOURCE_REF:refs/remotes/origin/npm-reviewed"
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/npm-reviewed
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify CLI and actual offline npm packaging
        run: |
          node --test server/npm/cli.test.cjs scripts/tests/stage_coordinated_release.test.mjs
          python3 -m unittest discover -s server -p test_npm_release_package.py
      - name: Prepare exact publishable payload
        run: python3 server/scripts/package_npm_release.py --output dist/npm-server --require-clean-source
      - name: Sign and verify npm release descriptor
        env:
          RELEASE_KEY_B64: ${{ secrets.AGENTS_SERVER_RELEASE_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          test -n "$RELEASE_KEY_B64"
          umask 077
          key_file="$RUNNER_TEMP/agents-server-npm-release.pem"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$RELEASE_KEY_B64" | base64 --decode > "$key_file"
          openssl pkeyutl -sign -rawin -inkey "$key_file" -in dist/npm-server/agents-server-npm-manifest.json -out dist/npm-server/agents-server-npm-manifest.sig
          openssl pkeyutl -verify -rawin -pubin -inkey server/release-public-key.pem -in dist/npm-server/agents-server-npm-manifest.json -sigfile dist/npm-server/agents-server-npm-manifest.sig
      - uses: actions/upload-artifact@v4
        with:
          name: npm-server-${{ inputs.source_sha }}
          path: dist/npm-server/*
          if-no-files-found: error
          retention-days: 14
